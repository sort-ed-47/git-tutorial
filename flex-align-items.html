<!DOCTYPE html>
<html>
<head>

<style>

.container {
    display: flex;

    /* Aligns items along the cross axis */
    align-items: center;
   justify-content: space-evenly;
    /* align-items: flex-start; */
    /* align-items: flex-end; */

    width: 600px;
    height: 400px;

    border: 2px solid black;
}

.box {
    width: 100px;
    height: 100px;

    background-color: lightgreen;

    margin: 5px;

    text-align: center;
}

</style>

</head>

<body>

<div class="container">

    <div class="box">1</div>
    <div class="box">4</div>
    <div class="box">3</div>

</div>

</body>
</html>
